# Moves a build from one tag to the next, by hand, then waits until it runs and is ready. test takes
# what dev has, or one exact build you name. prod takes what test has, now or at a set time. What was there
# before is kept as the backup.
# Trivy scans each build before it moves. A promote to prod stops when a build has a fixable HIGH or CRITICAL
# that .trivyignore does not hold.
name: promote
# The title of the run in the Actions list.
run-name: ${{ inputs.action }} ${{ inputs.service }} → ${{ inputs.to }} ${{ inputs.build }}${{ inputs.at != '' && format(' at {0} Pacific', inputs.at) || '' }}

# When it runs: only by hand, with these five choices.
on:
  workflow_dispatch:
    inputs:
      action:
        description: promote moves a build forward; rollback puts the previous one back
        type: choice
        options: [promote, rollback]
      to:
        description: the tag that changes
        type: choice
        options: [test, prod]
      service:
        description: one image, or all of them
        type: choice
        options: [all, vsu-api, vsu-ui]
      build:
        description: promote to test only - one exact build, like sha-a1b2c3d. Empty means what dev has
        default: ''
      at:
        description: promote to prod only - the time to promote at, Pacific, like 2026-11-04 19:00. Empty means now
        default: ''

permissions:
  contents: read
  issues: write

jobs:
  # A promote at a set time is checked first, so no reviewer is asked to approve a time that cannot work.
  time:
    if: inputs.at != ''
    runs-on: ubuntu-24.04
    steps:
      # A time is for a promote to prod only. It is refused when it has passed, or is more than 30 days ahead:
      # GitHub's wait timer holds 1 to 43,200 minutes.
      - name: check the time
        env:
          AT: ${{ inputs.at }}
          ACTION: ${{ inputs.action }}
          TO: ${{ inputs.to }}
        run: |
          [ "$ACTION" = promote ] && [ "$TO" = prod ] || { echo "::error::A time is for a promote to prod only."; exit 1; }
          [[ "$AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}\ [0-9]{2}:[0-9]{2}$ ]] && date -d "$AT" > /dev/null || { echo "::error::Write the time like 2026-11-04 19:00."; exit 1; }
          MIN=$(( ($(TZ=America/Vancouver date -d "$AT" +%s) - $(date +%s) + 59) / 60 ))
          [ "$MIN" -ge 1 ] && [ "$MIN" -le 43200 ] || { echo "::error::$AT Pacific has passed, or is more than 30 days ahead."; exit 1; }

  # Scan each build before it moves, before any reviewer is asked: the build test would take, or the one prod would
  # take. For test it only reports. For prod it stops the promote of every image when one has a fixable HIGH or
  # CRITICAL, in the image or in its npm packages, that .trivyignore does not hold with the date the Product Owner
  # agreed, or when it cannot scan. The promote below then moves the very build scanned here. A promote at a set time
  # is scanned when it is booked, and at that time moves the build scanned and approved then. A rollback is not scanned.
  scan:
    needs: time
    if: ${{ !cancelled() && !failure() && inputs.action == 'promote' }}
    runs-on: ubuntu-24.04
    # The build environment holds BUILDER_TOKEN, which can read the images in tools.
    environment: build
    # One job per image you chose.
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.service == 'all' && '["vsu-api","vsu-ui"]' || format('["{0}"]', inputs.service)) }}
    name: scan ${{ matrix.image }}
    # Each image's digest, for the promote below.
    outputs:
      vsu-api: ${{ steps.pull.outputs.vsu-api }}
      vsu-ui: ${{ steps.pull.outputs.vsu-ui }}
    # Where the image is, and the tag the environment would take. The registry and the namespace are GitHub secrets.
    env:
      REGISTRY: ${{ secrets.REGISTRY }}
      IMAGE: ${{ secrets.REGISTRY }}/${{ secrets.REGISTRY_NAMESPACE }}/${{ matrix.image }}
      FROM: ${{ inputs.to == 'prod' && 'test' || inputs.build || 'dev' }}
    # For test, no step below stops the promote: each one only reports.
    steps:
      # Get the code, for its .trivyignore.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: ${{ inputs.to != 'prod' }}
        with: { persist-credentials: false }
      # Sign in to the registry as github-builder, pull the build, and note its digest and the commit it was built from.
      - name: docker pull
        id: pull
        continue-on-error: ${{ inputs.to != 'prod' }}
        env:
          BUILDER_TOKEN: ${{ secrets.BUILDER_TOKEN }}
          NAME: ${{ matrix.image }}
        run: |
          echo "$BUILDER_TOKEN" | docker login "$REGISTRY" -u github-builder --password-stdin
          docker pull -q "$IMAGE:$FROM"
          docker tag "$IMAGE:$FROM" "$NAME:promote"
          D=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$FROM" | cut -d@ -f2)
          [ -n "$D" ] || { echo "::error::$IMAGE:$FROM has no digest."; exit 1; }
          echo "$NAME=$D" >> "$GITHUB_OUTPUT"
          REV=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE:$FROM")
          [ "$REV" != "<no value>" ] || REV=""
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
      # Scan the image. For prod, a fixable HIGH or CRITICAL that .trivyignore does not hold fails this step, so nothing moves.
      - name: Trivy
        continue-on-error: ${{ inputs.to != 'prod' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:promote
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy.txt
          exit-code: ${{ inputs.to == 'prod' && '1' || '0' }}
      # An image that holds only an app's built files carries no list of its npm packages, so read the lockfiles of the
      # commit the build was made from. A build with no such label was made before this pipeline, and only its image is scanned.
      - name: npm lockfiles
        id: npm
        if: ${{ steps.pull.outputs.rev != '' }}
        continue-on-error: ${{ inputs.to != 'prod' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ matrix.image }}
          REV: ${{ steps.pull.outputs.rev }}
          LOCKS: '{"vsu-ui":["vsu-app/ClientApp"]}'
        run: |
          for d in $(echo "$LOCKS" | jq -r --arg i "$NAME" '.[$i][]?'); do
            mkdir -p "npm/$d"
            if ! gh api -H "Accept: application/vnd.github.raw" "repos/$GITHUB_REPOSITORY/contents/$d/package-lock.json?ref=$REV" > "npm/$d/package-lock.json" 2> gh.err; then
              # A folder with no lockfile is skipped; any other error stops a promote to prod.
              grep -q "HTTP 404" gh.err || { echo "::error::Could not read $d/package-lock.json at $REV: $(cat gh.err)"; exit 1; }
              rm -rf "npm/$d"
            fi
          done
          if [ -n "$(find npm -name package-lock.json 2>/dev/null)" ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "$NAME has no npm lockfile at $REV."; fi
      # Scan those packages. For prod, a fixable HIGH or CRITICAL that .trivyignore does not hold fails this step too.
      - name: Trivy, npm packages
        if: ${{ steps.npm.outputs.found == 'true' }}
        continue-on-error: ${{ inputs.to != 'prod' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: npm
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy-npm.txt
          exit-code: ${{ inputs.to == 'prod' && '1' || '0' }}
      # Put what it found on the run's Summary.
      - name: findings on the summary
        if: always() && hashFiles('trivy.txt', 'trivy-npm.txt') != ''
        continue-on-error: ${{ inputs.to != 'prod' }}
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          [ ! -f trivy.txt ] || { echo "### Trivy, $IMAGE:$FROM"; echo '```'; cat trivy.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [ ! -f trivy-npm.txt ] || { echo "### Trivy, the npm packages of $IMAGE:$FROM"; echo '```'; cat trivy-npm.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # When it stops a promote to prod, open an issue for DevOps.
      - name: open an issue
        if: ${{ failure() && inputs.to == 'prod' }}
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ matrix.image }}
        run: |
          gh issue create -R "$GITHUB_REPOSITORY" --title "promote failed: prod" --label cicd --assignee rohithvarmayadla \
            --body "The scan before the promote to prod stopped it, started by $GITHUB_ACTOR. The build of $IMAGE has a fixable HIGH or CRITICAL, in the image or in its npm packages, that .trivyignore does not hold, or it could not be scanned. Nothing moved. The tables are on the run's Summary: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  # A promote at a set time: one of prod's reviewers approves it now. Then prod-at's timer is set to the minutes
  # left, and the promote below waits on it.
  timer:
    needs: [time, scan]
    runs-on: ubuntu-24.04
    # The prod environment waits for one of its reviewers, and holds RELEASE_TIMER_TOKEN.
    environment: prod
    # What it may do: see which promote runs are waiting, and open an issue.
    permissions:
      actions: read
      issues: write
    steps:
      # Count the minutes left, now that it is approved. A time that passed while it waited is refused.
      - name: minutes left
        id: left
        env:
          AT: ${{ inputs.at }}
        run: |
          MIN=$(( ($(TZ=America/Vancouver date -d "$AT" +%s) - $(date +%s) + 59) / 60 ))
          [ "$MIN" -ge 1 ] && [ "$MIN" -le 43200 ] || { echo "::error::$AT Pacific has passed, or is more than 30 days ahead."; exit 1; }
          echo "minutes=$MIN" >> "$GITHUB_OUTPUT"
      # One timed release at a time: the timer is one setting on prod-at, so another timed promote that waits stops this one.
      - name: one at a time
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WAITING=$(gh run list -R "$GITHUB_REPOSITORY" -w promote.yml -s waiting --json displayTitle --jq '.[].displayTitle | select(endswith(" Pacific"))')
          [ -z "$WAITING" ] || { echo "::error::Another timed release waits: $WAITING. Cancel it, or wait until it has run."; exit 1; }
      # Set prod-at's timer to those minutes, with the one token here that may change the repo's environments.
      # The other settings stay: no admin can skip the timer, and only the default branch may use prod-at.
      - name: set the timer
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TIMER_TOKEN }}
          MIN: ${{ steps.left.outputs.minutes }}
        run: |
          jq -n --argjson m "$MIN" '{wait_timer: $m, can_admins_bypass: false, deployment_branch_policy: {protected_branches: false, custom_branch_policies: true}}' \
            | gh api -X PUT "repos/$GITHUB_REPOSITORY/environments/prod-at" --input - > /dev/null
          echo "Approved. The promote waits on prod-at for $MIN minutes." >> "$GITHUB_STEP_SUMMARY"
      # If anything above failed, open an issue for DevOps.
      - name: open an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create -R "$GITHUB_REPOSITORY" --title "promote failed: prod" --label cicd --assignee rohithvarmayadla \
            --body "The timed promote of ${{ inputs.service }} to prod was not set, started by $GITHUB_ACTOR. Nothing moved. The run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  promote:
    needs: [time, scan, timer]
    # It runs when nothing before it failed. A promote now skips the time and the timer, and a rollback skips the scan.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    # The environment holds PROMOTER_TOKEN and NAMESPACE: test, prod, or prod-at for a promote at a set time.
    # prod waits for one of its reviewers. prod-at waits on its timer: prod's reviewer approved it at the start.
    environment: ${{ inputs.at != '' && 'prod-at' || inputs.to }}
    # One job per image you chose: every image for all, or only the one you picked.
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.service == 'all' && '["vsu-api","vsu-ui"]' || format('["{0}"]', inputs.service)) }}
    name: ${{ matrix.image }}
    # Two promotes of the same image in the same environment never run at once. A timed one waits in a group
    # of its own, so a promote or a rollback now is never held behind it.
    concurrency:
      group: promote-${{ inputs.at != '' && 'prod-at' || inputs.to }}-${{ matrix.image }}
      cancel-in-progress: false
    # TOOLS is where the tags live, and NAMESPACE where the environment runs. FROM is the tag to take:
    # prod takes test; test takes dev, or the build you named.
    env:
      TOOLS: ${{ secrets.REGISTRY_NAMESPACE }}
      NAMESPACE: ${{ secrets.NAMESPACE }}
      TO: ${{ inputs.to }}
      FROM: ${{ inputs.to == 'prod' && 'test' || inputs.build || 'dev' }}
    steps:
      # Install oc.
      - uses: redhat-actions/openshift-tools-installer@bf1d8fd8fa963cff1d33688473e51f948748991e # v3.3
        with:
          oc: "4"
      # Sign in to the cluster as github-promoter.
      - name: oc login
        run: oc login --server="$CLUSTER_SERVER" --token="$PROMOTER_TOKEN"
        env:
          CLUSTER_SERVER: ${{ secrets.CLUSTER_SERVER }}
          PROMOTER_TOKEN: ${{ secrets.PROMOTER_TOKEN }}
      # Promote: keep what is there now as the backup, then move the tag to the very build the scan above read, by its
      # digest, so a source tag that moved since cannot slip in a build it never read. Prod never moves without it.
      - name: promote
        if: inputs.action == 'promote'
        env:
          SCANNED: ${{ needs.scan.outputs[matrix.image] }}
        run: |
          if [ -n "$SCANNED" ]; then SRC="$TOOLS/${{ matrix.image }}@$SCANNED"
          elif [ "$TO" = prod ]; then echo "::error::No scanned build to move, so nothing moved."; exit 1
          else SRC="$TOOLS/${{ matrix.image }}:$FROM"; fi
          oc tag "$TOOLS/${{ matrix.image }}:$TO" "$TOOLS/${{ matrix.image }}:$TO-backup" --reference-policy=local || echo "nothing to back up yet"
          oc tag "$SRC" "$TOOLS/${{ matrix.image }}:$TO" --reference-policy=local
      # Rollback: put the backup back.
      - name: rollback
        if: inputs.action == 'rollback'
        run: oc tag "$TOOLS/${{ matrix.image }}:$TO-backup" "$TOOLS/${{ matrix.image }}:$TO" --reference-policy=local
      # Check: wait until OpenShift runs the build the tag now names, in every Deployment and CronJob of the environment
      # that runs this image, and each Deployment is ready: its own health checks pass. A CronJob runs the build from
      # its next run. 10 minutes at most; if not, it fails here.
      - name: check
        timeout-minutes: 10
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          WANT=$(oc -n "$TOOLS" get istag "$IMAGE:$TO" -o jsonpath='{.image.metadata.name}')
          RUNS=$({ oc -n "$NAMESPACE" get deploy -o jsonpath='{range .items[*]}deployment/{.metadata.name} {.spec.template.spec.containers[*].image}{"\n"}{end}'; oc -n "$NAMESPACE" get cronjob -o jsonpath='{range .items[*]}cronjob/{.metadata.name} {.spec.jobTemplate.spec.template.spec.containers[*].image}{"\n"}{end}' 2>/dev/null || true; } | grep "/${IMAGE}[@:]" | cut -d' ' -f1)
          [ -n "$RUNS" ] || { echo "::error::Nothing in $TO runs $IMAGE."; exit 1; }
          for D in $RUNS; do
            # A CronJob that names the tag itself pulls it at every run, so it already follows the move.
            P='{.spec.template.spec.containers[*].image}'; M="@$WANT"
            [ "${D%%/*}" = cronjob ] && P='{.spec.jobTemplate.spec.template.spec.containers[*].image}' && M="@$WANT|/$IMAGE:$TO( |\$)"
            until oc -n "$NAMESPACE" get "$D" -o jsonpath="$P" | grep -qE "$M"; do sleep 10; done
            if [ "${D%%/*}" = cronjob ]; then
              echo "**${D#*/}** runs $IMAGE at \`$WANT\` in $TO from its next run." >> "$GITHUB_STEP_SUMMARY"
            else
              oc -n "$NAMESPACE" rollout status "$D" --timeout=10m
              echo "**${D#*/}** runs $IMAGE at \`$WANT\` in $TO, and is ready." >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      # If anything above failed, open an issue for DevOps.
      - name: open an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create -R "$GITHUB_REPOSITORY" --title "promote failed: ${{ inputs.to }}" --label cicd --assignee rohithvarmayadla \
            --body "${{ inputs.action }} of ${{ matrix.image }} to ${{ inputs.to }} failed, or its build was not ready within 10 minutes, started by $GITHUB_ACTOR. The app team can roll back. The run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
