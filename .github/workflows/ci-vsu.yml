name: CI VSU

# [1] WHEN IT RUNS — PRs, merges, a twice-monthly re-scan, and a manual button.
#     paths = the API reference graph (vsu-app -> Database -> Shared.Database) + the UI
#     folder (under vsu-app/**) + the formatting rulebook.
on:
  pull_request:
    branches: [development]
    paths:
      - "vsu-app/**"
      - "Database/**"
      - "Shared.Database/**"
      - ".csharpierrc"
  push:
    branches: [development]
    paths:
      - "vsu-app/**"
      - "Database/**"
      - "Shared.Database/**"
      - ".csharpierrc"
  schedule:
    - cron: "0 3 1,15 * *"
  workflow_dispatch:

# [2] GUARD RAIL · LEAST PRIVILEGE — read code, write scan reports, nothing else
permissions:
  contents: read
  security-events: write
  actions: read

# [3] GUARD RAIL · ONE RUN AT A TIME — a newer push cancels the outdated run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# [4] THE JOB — 'gate' is the exact check name branch protection requires green
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    # [5] SETUP -> API half (compile + format check) -> UI half (build) -> whole codebase (CodeQL)
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp,javascript-typescript
          queries: security-extended

      # ── API HALF: compile + verify formatting in one step ──
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build vsu-app/vsu-app.csproj -c Release -p:CSharpier_Check=true

      # ── UI HALF: build (lint deferred — angular-eslint not yet set up; tracked as a Finding) ──
      - uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: vsu-app/ClientApp/package-lock.json
      - working-directory: vsu-app/ClientApp
        run: |
          npm ci
          npm run build

      # ── WHOLE CODEBASE: CodeQL writes its report — C# + TypeScript, one run ──
      - uses: github/codeql-action/analyze@v4
