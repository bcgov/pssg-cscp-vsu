# ======================================================================================
#  Last Updated: 2026-03-10
#
#  Description:
#  Reusable workflow for building and publishing Docker images.
#  Follows ERA (EMCR-ESS-PORTAL) standard build template pattern.
#  Builds once, then pushes to OpenShift registry (critical for deployments) and
#  Artifactory (backup). Artifactory push failures are non-blocking.
#  Images are tagged as 'latest' with OCI labels for traceability.
# ======================================================================================

name: build-template-v2
# --- INPUTS AND SECRETS -------------------------------------------------------------
on:
  workflow_call:
    inputs:
      # The event that triggered the caller workflow (e.g., 'push', 'workflow_dispatch').
      EVENT_NAME:
        required: true
        type: string
      # Build context path for the Docker image.
      IMAGE_CONTEXT:
        required: true
        type: string
      # Optional additional build contexts for Docker.
      BUILD_CONTEXT:
        required: false
        type: string
        default: ""
      # Path to the Dockerfile.
      IMAGE_FILE:
        required: true
        type: string
      # Name of the image to be published.
      IMAGE_NAME:
        required: true
        type: string
      # URL of the Artifactory container registry.
      ARTIFACTORY_REGISTRY:
        required: true
        type: string
      # The branch name, used for tagging.
      BRANCH:
        required: false
        type: string

    secrets:
      ARTIFACTORY_USERNAME:
        required: true
      ARTIFACTORY_PASSWORD:
        required: true
      OCP4_PASSWORD:
        required: true
      OCP4_NAMESPACE:
        required: true
      OCP4_REGISTRY:
        required: true
      OPENSHIFT_SERVER:
        required: true

# --- JOBS ---------------------------------------------------------------------------
jobs:
  # ------------------------------------------------------------------------------------
  #  Job: build-and-publish
  #  Purpose: Build image once and push to OpenShift (critical) and Artifactory (backup).
  #  Note: Artifactory failures are non-blocking to ensure deployments proceed.
  # ------------------------------------------------------------------------------------
  build-and-publish:
    permissions:
      contents: read
      actions: read
      packages: write
      security-events: write      # Upload Trivy SARIF to GitHub Security tab
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.BRANCH }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to OpenShift Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.OCP4_REGISTRY }}
          username: unused
          password: ${{ secrets.OCP4_PASSWORD }}

      - name: Login to Artifactory
        id: artifactory-login
        uses: docker/login-action@v3
        continue-on-error: true
        with:
          registry: ${{ inputs.ARTIFACTORY_REGISTRY }}
          username: ${{ secrets.ARTIFACTORY_USERNAME }}
          password: ${{ secrets.ARTIFACTORY_PASSWORD }}

      - name: Extract Docker Image Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ inputs.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=${{ inputs.IMAGE_NAME }}
            org.opencontainers.image.version=${{ github.run_number }}
            org.opencontainers.image.ref.name=${{ inputs.BRANCH }}
            org.opencontainers.image.vendor=BC Government
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.IMAGE_CONTEXT }}
          build-contexts: ${{ inputs.BUILD_CONTEXT }}
          file: ${{ inputs.IMAGE_FILE }}
          push: false
          load: true
          tags: ${{ inputs.IMAGE_NAME }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true

      - name: Push to OpenShift Registry
        id: push-openshift
        run: |
          docker tag ${{ inputs.IMAGE_NAME }}:latest ${{ secrets.OCP4_REGISTRY }}/${{ secrets.OCP4_NAMESPACE }}/${{ inputs.IMAGE_NAME }}:latest
          docker push ${{ secrets.OCP4_REGISTRY }}/${{ secrets.OCP4_NAMESPACE }}/${{ inputs.IMAGE_NAME }}:latest

      - name: Push to Artifactory (non-blocking)
        id: push-artifactory
        continue-on-error: true
        run: |
          docker tag ${{ inputs.IMAGE_NAME }}:latest ${{ inputs.ARTIFACTORY_REGISTRY }}/${{ inputs.IMAGE_NAME }}:latest
          docker push ${{ inputs.ARTIFACTORY_REGISTRY }}/${{ inputs.IMAGE_NAME }}:latest

      # STEP: Print a summary of vulnerabilities in the built image (does not fail build)
      - name: Trivy Image Scan (Table Summary)
        uses: aquasecurity/trivy-action@0.31.0
        with:
          scan-type: "image"
          image-ref: "${{ inputs.IMAGE_NAME }}:latest"
          scanners: "vuln,secret"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          ignore-unfixed: true

      # STEP: Main vulnerability scan on the built image (for GitHub Security tab, fails build if needed)
      - name: Scan Image for Vulnerabilities
        uses: aquasecurity/trivy-action@0.31.0
        with:
          scan-type: "image"
          image-ref: "${{ inputs.IMAGE_NAME }}:latest"
          scanners: "vuln,secret"
          format: "sarif"
          output: "trivy-image-results-${{ inputs.IMAGE_NAME }}.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true
          limit-severities-for-sarif: true

      - name: Upload Vulnerability Scan Results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-image-results-${{ inputs.IMAGE_NAME }}.sarif"
          category: "trivy-scan-${{ inputs.IMAGE_NAME }}"

      - name: Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: ${{ inputs.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "- **Build**: #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ inputs.BRANCH }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### OpenShift Registry (Primary)" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.push-openshift.outcome }}" == "success" ]; then
            echo "- **Status**: ✅ Success" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Status**: ❌ Failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Image**: ${{ secrets.OCP4_REGISTRY }}/${{ secrets.OCP4_NAMESPACE }}/${{ inputs.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifactory (Backup)" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.push-artifactory.outcome }}" == "success" ]; then
            echo "- **Status**: ✅ Success" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Status**: ⚠️ Failed (non-blocking)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Image**: ${{ inputs.ARTIFACTORY_REGISTRY }}/${{ inputs.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
