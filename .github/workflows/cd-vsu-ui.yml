# ======================================================================================
#  Last Updated: 2026-03-10
#
#  Description:
#  This is the main CD workflow for the VSU UI (Angular frontend).
#  It orchestrates the build and deployment process for the UI service.
#
#  Triggers:
#  1. Automatic (`push`): Triggers automatically when code is merged to 'development' branch.
#  2. Manual (`workflow_dispatch`): Allows for manual deployments.
#
#  Note: Commit SHA and build metadata are automatically baked into image labels.
#
# ======================================================================================

name: CD VSU UI

# --- TRIGGERS -----------------------------------------------------------------------
on:
  # Triggers this workflow when code is merged to development branch
  push:
    branches: [development]
    paths:
      - "vsu-app/ClientApp/**"

  # manual trigger
  workflow_dispatch:

# --- JOBS ---------------------------------------------------------------------------
jobs:
  # ------------------------------------------------------------------------------------
  #  Job: build-and-deploy
  #  Purpose: Calls the reusable build workflow to build, publish, and scan the image.
  # ------------------------------------------------------------------------------------
  build-and-deploy:
    permissions:
      # Core repository and deployment access
      contents: read              # Read repository files and clone code
      actions: read               # Read workflow runs and job information for private repo access
      packages: write             # Push Docker images to container registry
      # Environment and security
      id-token: write             # Required for environment protection and OIDC
    uses: ./.github/workflows/build-template-v2.yml
    with:
      EVENT_NAME: ${{ github.event_name }}
      IMAGE_CONTEXT: ./vsu-app/ClientApp
      IMAGE_FILE: ./vsu-app/ClientApp/Dockerfile
      IMAGE_NAME: vsu-ui
      BRANCH: ${{ github.ref_name }}
    secrets:
      OCP4_PASSWORD: ${{ secrets.OCP4_PASSWORD }}
      OCP4_NAMESPACE: ${{ secrets.OCP4_NAMESPACE }}
      OCP4_REGISTRY: ${{ secrets.OCP4_REGISTRY }}
      OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
