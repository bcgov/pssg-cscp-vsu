name: CD VSU UI

# [1] WHEN IT RUNS — a merge touching the UI folder, or manual.
on:
  push:
    branches: [development]
    paths:
      - "vsu-app/ClientApp/**"
      - ".dockerignore"
  workflow_dispatch:

# [2] GUARD RAIL · LEAST PRIVILEGE — read code + write scan reports; registry access = repo secrets only
permissions:
  contents: read
  security-events: write
  actions: read

# [3] GUARD RAIL · ONE BUILD PER IMAGE AT A TIME — a newer merge cancels the stale build
concurrency:
  group: cd-vsu-ui-${{ github.ref }}
  cancel-in-progress: true

# [4] THE JOB — hard 30-minute cap
jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # [5] fetch -> registry login -> names+labels -> build+push -> scan -> report
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ secrets.OCP4_REGISTRY }}
          username: unused
          password: ${{ secrets.OCP4_PASSWORD }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.OCP4_REGISTRY }}/${{ secrets.OCP4_NAMESPACE }}/vsu-ui
          tags: |
            type=raw,value=latest          # newest build — what Argo dev watches here, and a promotion's default source
            type=raw,value=development     # dev environment tag (kept for the estate contract; Argo-dev keys on :latest for VSU)
            type=sha                       # sha-<commit> — permanent per-commit bookmark
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./vsu-app/ClientApp/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max                    # SLSA provenance — workflow, exact commit, base image name+digest
          sbom: true                              # SPDX SBOM — every package inside, queryable forever
      - uses: aquasecurity/trivy-action@v0.36.0    # third-party — pin to commit SHA when hardening
        with:
          image-ref: ${{ secrets.OCP4_REGISTRY }}/${{ secrets.OCP4_NAMESPACE }}/vsu-ui:latest
          format: sarif
          output: trivy-vsu-ui.sarif
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-vsu-ui.sarif
          category: trivy-vsu-ui
