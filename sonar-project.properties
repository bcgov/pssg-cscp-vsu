# SonarQube project configuration
sonar.projectKey=bcgov_pssg-cscp-vsu
sonar.organization=bcgov
sonar.projectName=Coast VSU
sonar.projectVersion=1.0

# Source code
sonar.sources=vsu-app,vsu-cornet
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/wwwroot/**,**/bin/**,**/obj/**,**/*.min.js,**/ClientApp/e2e/**,**/openshift/**

# Language-specific settings
sonar.typescript.lcov.reportPaths=vsu-app/ClientApp/coverage/lcov.info,vsu-cornet/ClientApp/coverage/lcov.info
sonar.javascript.lcov.reportPaths=vsu-app/ClientApp/coverage/lcov.info,vsu-cornet/ClientApp/coverage/lcov.info

# C# settings
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.cs.vstest.reportsPaths=**/*.trx

# Test exclusions
sonar.test.exclusions=**/*.spec.ts,**/*.test.ts,**/e2e/**,**/karma.conf.js,**/protractor.conf.js